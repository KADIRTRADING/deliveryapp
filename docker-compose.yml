version: "3.9"

# Local development stack: the Next.js app, PostgreSQL, Redis (cache / rate
# limiting / future queues), and RustFS (S3-compatible object storage) so the
# StorageProvider abstraction has a real backend to talk to without any cloud
# credentials. See README.md "Docker" section for usage instructions.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://deliveryapp:deliveryapp@postgres:5432/deliveryapp
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not gated on storage's healthcheck: the app can start and serve
      # most routes (including GET /api/health) before object storage is
      # ready — only upload-related endpoints need it, and they'll simply
      # fail with a clear error if called too early.
      storage:
        condition: service_started
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm run prisma:migrate:deploy && npm run dev"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deliveryapp
      POSTGRES_PASSWORD: deliveryapp
      POSTGRES_DB: deliveryapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development, backing the
  # StorageProvider abstraction (see src/modules/storage/storage-provider.ts).
  # Uses RustFS rather than MinIO: MinIO stopped publishing pre-built Docker
  # images for its community edition in October 2025 and its Docker Hub
  # repository was removed entirely by September 2026, so `minio/minio` can
  # no longer be pulled. RustFS is an actively-maintained, S3-API-compatible,
  # open-source drop-in with the same API/console port layout.
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: deliveryapp
      RUSTFS_SECRET_KEY: deliveryapp123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    # Best-effort: not depended on by `app` (see its `depends_on` below),
    # so an unavailable healthcheck tool inside this image degrades to
    # "reported unhealthy in `docker compose ps`" rather than blocking startup.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  storage_data:
  app_node_modules:
