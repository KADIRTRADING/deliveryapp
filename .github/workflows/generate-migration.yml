name: Generate Prisma Migration

# Utility workflow. This sandbox environment cannot run `prisma migrate dev`
# locally (no local Postgres, no package-registry network access), so
# migration files are generated here — against a real Postgres instance, on
# GitHub's infrastructure — and committed back to the branch that triggered
# the run.
#
# NOTE: this intentionally does NOT use `workflow_dispatch`. GitHub only
# recognizes workflow_dispatch-triggered workflows that exist on the
# repository's default branch, and this repo's default-branch setting is not
# changeable via the API in this environment (repo-settings PATCH calls are
# blocked by the sandbox's outbound gateway with a 403). `push`/`pull_request`
# triggers have no such restriction — the workflow file is read from the
# commit being built — so instead this fires automatically whenever
# prisma/schema.prisma changes on any branch. Reads the desired migration
# name from a `MIGRATION_NAME` file at the repo root (defaults to "update" if
# absent), so it can be renamed per change without editing this workflow.

on:
  push:
    paths:
      - "prisma/schema.prisma"
      - ".github/workflows/generate-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deliveryapp
          POSTGRES_PASSWORD: deliveryapp
          POSTGRES_DB: deliveryapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deliveryapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://deliveryapp:deliveryapp@localhost:5432/deliveryapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Determine migration name
        id: migration-name
        run: |
          if [ -f MIGRATION_NAME ]; then
            NAME=$(cat MIGRATION_NAME | tr -d '[:space:]')
          else
            NAME="update"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate migration
        run: npx prisma migrate dev --name "${{ steps.migration-name.outputs.name }}" --skip-seed

      - name: Commit and push migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "chore(prisma): generate migration '${{ steps.migration-name.outputs.name }}'"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
