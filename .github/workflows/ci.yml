name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Install, lint, typecheck, validate, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deliveryapp
          POSTGRES_PASSWORD: deliveryapp
          POSTGRES_DB: deliveryapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deliveryapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://deliveryapp:deliveryapp@localhost:5432/deliveryapp
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      SESSION_COOKIE_NAME: dapp_session
      CSRF_COOKIE_NAME: dapp_csrf
      STORAGE_PROVIDER: mock
      MAP_PROVIDER: mock
      PAYMENT_DEFAULT_PROVIDER: mock
      SMS_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed yet (it is generated on first
      # `npm install` — see README "Getting Started"), so we use `npm install`
      # rather than `npm ci` here. Once a lock file exists, switch this back
      # to `npm ci` for reproducible, faster installs.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Type check
        run: npm run typecheck

      - name: Run database migrations
        run: npm run prisma:migrate:deploy

      - name: Run tests
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Verify Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real verification that the production Docker image actually builds
      # end-to-end (deps install, prisma generate, next build, standalone
      # copy) — this sandbox's development environment has no outbound
      # access to any container registry, so this is the only place this
      # Dockerfile is ever actually built and checked.
      - name: Build production image
        run: docker build --target production -t deliveryapp:ci-check .

      - name: Build development image
        run: docker build --target development -t deliveryapp:ci-check-dev .

      - name: Create .env for compose smoke test
        run: cp .env.example .env

      - name: Start full stack via docker compose
        run: docker compose up -d --build

      - name: Wait for the app to respond healthy
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo ""
              echo "App is healthy."
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "App did not become healthy in time."
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
